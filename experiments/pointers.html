<html lang="en">
<head>
    <meta charset="UTF-8">

  <meta property="og:type" content="website">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "CodeCraft by Play Code",
    "url": "https://codecraft.playcode.com.ar/",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "All",
    "browserRequirements": "Requires JavaScript",
    "description": "Simulador y laboratorio 3D para aprender lógica de programación con Minecraft desarrollado por Play Code.",
    "creator": {
      "@type": "EducationalOrganization",
      "name": "Play Code",
      "url": "https://playcode.com.ar"
    }
  }
  </script>
</head>
<body>
    <div id="captured"></div>
    <script>
        const pointers = []
        const up = () => {
            captured.textContent = pointers.join(', ')
        }
        window.addEventListener('pointerdown', (e) => {
            pointers.push(e.pointerId)
            document.body.setPointerCapture(e.pointerId)
            up()
            e.preventDefault()
        })
        const remove = (id) => {
            pointers.splice(pointers.indexOf(id), 1)
            up()
        }
        window.addEventListener('pointerup', (e) => {
            pointers.push('up')
            remove(e.pointerId)
        })
        window.addEventListener('pointercancel', (e) => {
            pointers.push('cancel')
            remove(e.pointerId)
        })
        window.addEventListener('lostpointercapture', (e) => {
            pointers.push('lost')
            remove(e.pointerId)
        })
    </script>
  <script src="https://edu.playcode.com.ar/wp-content/plugins/playcode-domain-analytics/tracker.js" async></script>
</body>
</html>
